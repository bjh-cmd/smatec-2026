<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a2344">
<title>2026 경기 제조 AX 컨퍼런스 자료집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{font-family:'Noto Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#16283b;background:#f3f6fa}
*{box-sizing:border-box}
body{margin:0}
a{text-decoration:none}
.hero{background:#0a2344;color:#fff;padding:72px 24px 64px}
.wrap{max-width:1080px;margin:0 auto}
.hero .wrap{display:flex;flex-wrap:wrap;gap:40px;align-items:flex-end;justify-content:space-between}
.hero-text{flex:1 1 520px;min-width:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;color:#8fd0ff}
h1{margin:16px 0 14px;font-size:clamp(30px,5vw,48px);line-height:1.3;font-weight:800;color:#fff}
.hero p{margin:0;font-size:16px;line-height:1.7;color:#cfe2f4}
.stats{display:flex;flex-wrap:wrap;gap:12px}
.stat{border:1px solid #3a5a82;border-radius:14px;padding:16px 22px;min-width:120px}
.stat b{display:block;font-size:26px;font-weight:800;color:#fff}
.stat span{display:block;font-size:12px;margin-top:4px;color:#a9c9e6}
.main{padding:32px 24px 72px}
.notice{background:#fff;border:1px solid #dce5ed;border-radius:14px;padding:18px 22px;font-size:14px;line-height:1.7;color:#4a5e73}
.section{margin-top:44px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:16px}
.sec-label{font-size:12px;font-weight:700;letter-spacing:1.5px;color:#1d6bb3}
.sec-head h2{margin:4px 0 0;font-size:24px;font-weight:800;line-height:1.4}
.sec-count{font-size:13px;font-weight:500;color:#55697e}
.list{display:flex;flex-direction:column;gap:12px}
.item{display:flex;flex-wrap:wrap;align-items:center;gap:16px 20px;background:#fff;border:1px solid #dce5ed;border-radius:16px;padding:20px 24px;box-shadow:0 2px 10px #0b315008}
.number{flex-shrink:0;width:48px;height:48px;border-radius:12px;background:#e6f0fb;color:#14528d;font-weight:800;display:flex;align-items:center;justify-content:center}
.content{flex:1 1 340px;min-width:0}
.speaker{font-size:13px;font-weight:700;color:#4d6176}
.topic{font-size:17px;font-weight:800;line-height:1.5;margin:6px 0 10px}
.pages{display:inline-block;background:#eef3f8;color:#4d6176;font-size:12px;font-weight:500;padding:3px 10px;border-radius:99px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:10px;background:#fff;color:#1d4a73;border:1px solid #b9cadb;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap}
.btn.primary{background:#155b9b;border-color:#155b9b;color:#fff;padding:0 20px}
.btn:hover{filter:brightness(.95)}
.btn:focus-visible,.close:focus-visible{outline:3px solid #7fb8ec;outline-offset:2px}
footer{color:#55697e;font-size:12px;text-align:center;padding:8px 24px 40px}
.modal{position:fixed;inset:0;background:#071525e8;display:none;z-index:5;flex-direction:column}
.modal.open{display:flex}
.toolbar{padding:10px 14px;background:#fff;display:flex;align-items:center;gap:10px}
.toolbar strong{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal iframe{width:100%;flex:1;border:0;background:#fff}
.close{border:0;background:#e7edf4;border-radius:8px;padding:0 14px;min-height:44px;cursor:pointer;font-family:inherit;font-size:14px}
body.lock{overflow:hidden}
@media(max-width:650px){.hero{padding-top:44px;padding-bottom:44px}.item{padding:16px}.actions{width:100%}.btn{flex:1}.sec-head h2{font-size:20px}}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
<div class="hero-text">
<div class="eyebrow">SMATEC 2026 · DIGITAL CONFERENCE</div>
<h1>2026 경기 제조 AX<br>컨퍼런스 자료집</h1>
<p>오전 강연자료와 오후 발표자료를 행사 순서대로 확인하실 수 있습니다.</p>
</div>
<div class="stats">
<div class="stat"><b>11.18</b><span>2026년 · 수요일</span></div>
<div class="stat"><b>12개</b><span>PDF 자료</span></div>
<div class="stat"><b>3개</b><span>세션</span></div>
</div>
</div></header>
<main class="main wrap">
<div class="notice">자료는 강연자 및 발표기업에서 제공한 배포용 파일입니다. 저작권은 각 자료의 권리자에게 있으며, 무단 재배포 및 상업적 이용은 삼가 주시기 바랍니다.</div>
<div id="sections"></div>
</main>
<footer>경기도 · 경기테크노파크 | 경기스마트제조혁신센터</footer>

<div class="modal" id="viewer" role="dialog" aria-modal="true" aria-label="발표자료 보기">
<div class="toolbar">
<strong id="viewtitle"></strong>
<a class="btn" id="download" download>PDF 저장</a>
<button class="close" id="close" type="button" aria-label="닫기">✕ 닫기</button>
</div>
<iframe id="frame" title="PDF 발표자료"></iframe>
</div>

<script>
// 08번은 파일이 커서(약 173MB) GitHub에 올릴 수 없어 구글 드라이브로 연결합니다.
// 나중에 압축본을 lecture_08.pdf로 올리면 아래 drive 항목을 지우면 됩니다.
const DRIVE_08 = "1qYLAMuVrAOUhvKGV2VPWi5Bs0U5Ttqpi";

const items = [
 {section:"스마트제조 AI 기술 포럼", label:"SESSION 1 · 오전", speaker:"홍아름 · 경희대학교 테크노경영대학원 부대학원장·교수", title:"「AI를 도입하는 기업에서, AI로 경쟁하는 기업으로」: Agentic AI 시대, 제조기업의 새로운 경쟁전략", file:"lecture_01.pdf", pages:30, num:1},
 {section:"스마트제조 AI 기술 포럼", speaker:"박정윤 · 인터엑스 대표", title:"제조 AX 최신 트렌드와 핵심기술", file:"lecture_02.pdf", pages:35, num:2},
 {section:"스마트제조 AI 기술 포럼", speaker:"민효기 · 스피드랙 대표", title:"생성형 AI를 활용한 중소기업 업무 프로세스 혁신 및 자동화 사례", file:"lecture_03.pdf", pages:26, num:3},
 {section:"중소·중견기업 제조혁신을 위한 경기도 디지털 솔루션 소개", label:"SESSION 2 · 오후", speaker:"정동배 · 보목 COO", title:"현장에서 시작하는 제조 DX : 중소 제조기업 맞춤형 MES ‘SOLOMON.U.S.E’", file:"lecture_04.pdf", pages:14, num:4},
 {section:"중소·중견기업 제조혁신을 위한 경기도 디지털 솔루션 소개", speaker:"박예진 · 조앤소프트 매니저", title:"반도체 PCB 핵심 소재 공정 AI MES 구축과 확산 전략", file:"lecture_05.pdf", pages:50, num:5},
 {section:"중소·중견기업 제조혁신을 위한 경기도 디지털 솔루션 소개", speaker:"강진규 · 세르딕 대표이사", title:"레트로핏 기반 AI 안전관리 : 기존 시설을 유지·활용하는 효율적 AX 전환", file:"lecture_06.pdf", pages:15, num:6},
 {section:"중소·중견기업 제조혁신을 위한 경기도 디지털 솔루션 소개", speaker:"이용원 · 비스텍 대표이사", title:"현장에서 바로 쓰는 쉬운 AI 머신비전 : 도입 실증 사례 중심", file:"lecture_07.pdf", pages:12, num:7},
 {section:"중소·중견기업 제조혁신을 위한 경기도 디지털 솔루션 소개", speaker:"곽희만 · 토마스오토메이션 팀장", title:"숙련공의 손기술을 로봇이 학습하다 : 표면처리공정을 위한 모션학습기반 AI 로봇자동화 솔루션", file:"lecture_08.pdf", pages:17, num:8,
  drive:{view:"https://drive.google.com/file/d/"+DRIVE_08+"/view", preview:"https://drive.google.com/file/d/"+DRIVE_08+"/preview"}},
 {section:"중소·중견기업 제조혁신을 위한 경기도 디지털 솔루션 소개", speaker:"이종우 · 링크제니시스 본부장", title:"AI 자율제조를 위한 레거시 설비 무개조 통합 자동화 플랫폼 : EQlizer Platform", file:"lecture_09.pdf", pages:17, num:9},
 {section:"중소·중견기업 제조혁신을 위한 경기도 디지털 솔루션 소개", speaker:"최길주 · 심비즈코리아 대표이사", title:"공장의 AI, 문서에서 시작합니다 : 쓴다 · 잇는다 · 메운다 · 맡긴다", file:"lecture_10.pdf", pages:19, num:10},
 {section:"중소·중견기업 제조혁신을 위한 경기도 디지털 솔루션 소개", speaker:"방승현 · 모비스 이사", title:"데이터 탐지에서 자율적 행동까지 : MOI 솔루션 기반의 제조 AI 및 AI Agent 활용실무", file:"lecture_11.pdf", pages:26, num:11},
 {section:"경기테크노파크 사업 안내", label:"SESSION 3", speaker:"서영민 · 경기테크노파크 과장", title:"2027년 경기도형 스마트공장 종합지원 계획(안)", file:"lecture_12.pdf", pages:13, num:12}
];

const FORUM = "스마트제조 AI 기술 포럼";
const root = document.getElementById("sections");
const groups = [...new Set(items.map(x => x.section))];

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

for (const section of groups){
  const arr = items.filter(x => x.section === section);
  const isForum = section === FORUM;
  const sec = el("section", "section");

  const head = el("div", "sec-head");
  const left = el("div");
  left.append(el("div", "sec-label", arr[0].label || ""), el("h2", "", section));
  head.append(left, el("div", "sec-count", arr.length + "개 " + (isForum ? "강연자료" : "발표자료")));
  sec.append(head);

  const list = el("div", "list");
  for (const x of arr){
    const card = el("article", "item");
    card.append(el("div", "number", String(x.num).padStart(2, "0")));

    const info = el("div", "content");
    info.append(el("div", "speaker", x.speaker), el("div", "topic", x.title), el("span", "pages", x.pages + "페이지"));

    const actions = el("div", "actions");
    const view = el("button", "btn primary", isForum ? "강연자료 보기" : "발표자료 보기");
    view.type = "button";
    view.onclick = () => openViewer(x);

    const save = el("a", "btn", "PDF 저장");
    if (x.drive){
      save.href = x.drive.view;
      save.target = "_blank";
      save.rel = "noopener";
      save.textContent = "PDF 저장 (드라이브)";
    } else {
      save.href = encodeURI(x.file);
      save.download = x.file;
    }
    actions.append(view, save);
    card.append(info, actions);
    list.append(card);
  }
  sec.append(list);
  root.append(sec);
}

const modal = document.getElementById("viewer");
const frame = document.getElementById("frame");
const dl = document.getElementById("download");
let lastFocus = null;

function openViewer(x){
  lastFocus = document.activeElement;
  document.getElementById("viewtitle").textContent = x.speaker + " · " + x.title;
  if (x.drive){
    frame.src = x.drive.preview;
    dl.href = x.drive.view;
    dl.target = "_blank";
    dl.rel = "noopener";
    dl.removeAttribute("download");
    dl.textContent = "PDF 저장 (드라이브)";
  } else {
    frame.src = encodeURI(x.file) + "#toolbar=1";
    dl.href = encodeURI(x.file);
    dl.removeAttribute("target");
    dl.download = x.file;
    dl.textContent = "PDF 저장";
  }
  modal.classList.add("open");
  document.body.classList.add("lock");
  document.getElementById("close").focus();
}
function closeViewer(){
  modal.classList.remove("open");
  document.body.classList.remove("lock");
  frame.src = "about:blank";
  if (lastFocus) lastFocus.focus();
}
document.getElementById("close").onclick = closeViewer;
document.addEventListener("keydown", e => { if (e.key === "Escape" && modal.classList.contains("open")) closeViewer(); });
</script>
</body>
</html>
